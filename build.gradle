apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

ext{
    mindustryVersion = "v160.5"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories{
    mavenCentral()
    ivy{
        url = 'https://github.com/'
        patternLayout{ artifact('/[organisation]/[module]/releases/download/[revision]/dependencies.jar') }
        metadataSources{ artifact() }
        content{ includeVersion("Anuken", "Mindustry", mindustryVersion) }
    }
}

java{
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies{
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

tasks.register('jarAndroid'){
    dependsOn "jar"
    def projectName = project.name
    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("Set ANDROID_HOME or ANDROID_SDK_ROOT to build the Android-compatible JAR.")
        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }
        if(!platformRoot) throw new GradleException("No Android platform containing android.jar was found.")
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")
        def d8 = isWindows ? "d8.bat" : "d8"
        def process = "$d8 $dependencies --min-api 21 --output ${projectName}Android.jar ${projectName}Desktop.jar".execute(null, new File("build/libs"))
        process.waitForProcessOutput(System.out, System.err)
        if(process.exitValue() != 0) throw new GradleException("d8 failed with exit code ${process.exitValue()}")
    }
}

jar{
    archiveFileName = "${project.name}Desktop.jar"
    from(projectDir){ include "mod.hjson" }
    from("assets/"){ include "**" }
}

tasks.register('deploy', Jar){
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from{ [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }
    doLast{ delete{ delete "build/libs/${projectName}Android.jar" } }
}
